<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>REPUBLIC DAY</title>
</head>
<body class="flex flex-col min-h-screen bg-[url(https://i.postimg.cc/9MstdWdg/Home1.jpg)] bg-cover bg-center bg-no-repeat">

    <div class="bg-linear-to-r from-orange-500 via-white to-green-500 flex justify-between items-center p-2 sm:p-3 md:-4 xl:p-6">
                    
            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25" onclick="openHome()">HOME</button>

             <div>

            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25 lg:mr-5" onclick="openRepublic()">REPUBLIC</button>
             
            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25 lg:mr-5" onclick="openPreamble()">PREAMBLE</button>

            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25 lg:mr-5" onclick="openConstitution()">CONSTITUTION</button>

            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25 lg:mr-5" onclick="openLeader()">LEADER</button>

            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25 lg:mr-5" onclick="openRight()">RIGHT</button>

            <button  class="text-[10px] text-blue-600 font-bold p-0.5 cursor-pointer border-b-4 hover:border-t-4 hover:border-b-0 focus:border-t-4 focus:border-b-0 rounded-[999px]
             border-t-orange-700 border-b-green-700 border-r-white border-l-white shadow-[0_10px_30px_rgba(0,0,0,0.15)]
             ease-[cubic-bezier(0.176,0.885,0.32,1.275)] hover:-translate-y-1.5 hover:shadow-[0_15px_40px_rgba(0,0,0,0.25)] sm:text-sm md:text-base md:p-1 lg:text-xl lg:p-1.25 lg:mr-5" onclick="openDuty()">DUTY</button>
    </div>

    </div>

    <div class="flex-1 flex flex-col justify-center items-center pb-10">

        <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-9xl font-extrabold text-transparent bg-clip-text mb-10 bg-gradient-to-b from-red-900 via-white to-green-900 drop-shadow-lg">
         REPUBLIC DAY QUIZ
        </h1>

  <div class="rounded-3xl border-t-8 border-b-8 border-t-orange-500 border-b-green-500 bg-white/30 backdrop-blur-md py-5 flex flex-col items-center m-3">

    <div id="quizBox" class="w-[60%] lg:w-[65%] text-center">

      <h4 id="questionCount"
          class="text-[18px] font-bold text-white bg-black/60 px-4 py-1 rounded mb-[10px] inline-block">
      </h4>

      <h3 id="question"
          class="text-xl md:text-2xl text-white bg-black/70 px-4 py-3 rounded mb-[15px] inline-block">
      </h3>

      <form id="options" class="space-y-3"></form>

      <button id="nextBtn" onclick="nextQuestion()"
        class="mt-4 text-2xl font-bold text-pink-700 px-4 py-2 rounded-full border-b-4 border-t-orange-700 border-b-green-700 border-x-white shadow-lg 
        transition-all hover:border-t-4 hover:border-b-0 hover:-translate-y-1">
        NEXT
      </button>

    </div>

  </div>

  <div class="fixed inset-0 -z-10 pointer-events-none animate-ping translate-y-[20vh] duration-1000 delay-1000">

           <img src="https://i.postimg.cc/L4gyQWbz/balloon.png" class="w-full h-full object-cover" /> 
            
      </div>

</div>

 <div class="bg-linear-to-r from-orange-500 via-white to-green-500 flex flex-col justify-center items-center p-2 sm:p-3 md:-4 xl:p-6"> 

        <h3 class="font-bold sm:text-sm md:text-base lg:text-xl">© 2026 Republic Day Project | All Rights Reserved</h3>
        <h3 class="font-bold sm:text-sm md:text-base lg:text-xl">Designed & Developed by Pawan Kumar</h3>

    </div>
    <script src="quiz.js"></script>
</body>
</html>
